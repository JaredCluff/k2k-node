[package]
name = "k2k-node"
version = "0.1.0"
edition = "2021"
description = "Lightweight K2K federation node — reference implementation of the K2K protocol"
license = "Apache-2.0"
repository = "https://github.com/jaredcluff/k2k-node"
authors = ["Jared Cluff <jared.b.cluff@gmail.com>"]
keywords = ["k2k", "federation", "ai", "semantic-search", "distributed"]
categories = ["command-line-utilities"]

[dependencies]
# K2K protocol library
k2k-common = { git = "https://github.com/jaredcluff/nexibot.git", branch = "main" }

# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# HTTP server
axum = "0.7"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# JWT auth
jsonwebtoken = "9"
rsa = "0.9"
pem = "3.0"
base64 = "0.22"
sha2 = { version = "0.10", features = ["oid"] }
subtle = "2"

# SQLite persistence
rusqlite = { version = "0.35", features = ["bundled"] }

# ONNX Runtime (embeddings)
ort = { version = "=2.0.0-rc.10", features = ["download-binaries"] }
ndarray = "0.16"
tokenizers = { version = "0.20", default-features = false, features = ["onig"] }

# mDNS discovery
mdns-sd = "0.11"

# DNS SRV lookup
trust-dns-resolver = "0.23"

# CLI
clap = { version = "4", features = ["derive"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1"
thiserror = "1"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# Random
rand = "0.8"

# File walking
walkdir = "2"

# System info
hostname = "0.4"
dirs = "5"
